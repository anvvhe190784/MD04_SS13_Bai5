server:
  port: 8888

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: identity-route
          uri: http://localhost:8080
          predicates:
            - Path=/identity/**
          filters:
            - StripPrefix=1
        - id: products-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/products/**

